server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # CORS headers required for Godot's SharedArrayBuffer (threading support)
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # A Godot export writes the same four names every time -- index.js,
    # index.wasm, index.pck, index.html -- so nothing here is immutable: a
    # deploy replaces the file at the URL a browser has already cached. Told
    # otherwise, a browser keeps whichever half it had and pairs it with the
    # half it fetched, and the page dies on
    #
    #   LinkError: Import #13 "env" "godot_audio_get_sample_playback_position"
    #
    # which is a 4.4 wasm asking a 4.3 loader for a function it has never
    # heard of. So they are revalidated, which the ETag makes cheap: unchanged
    # files answer 304 and nothing is sent, and the 78MB pack is downloaded
    # again only when it really has changed.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|wasm|pck)$ {
        add_header Cache-Control "no-cache" always;

        # Maintain CORS headers for all responses
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Specific handling for WebAssembly files
    location ~ \.wasm$ {
        add_header Content-Type "application/wasm";

        # CORS headers
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss application/wasm;

    # Fallback to index.html for client-side routing (if needed)
    location / {
        try_files $uri $uri/ /index.html;

        # CORS headers on main page too
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
