<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     shape-rendering="crispEdges">
  <!-- Heart, one per try the run has left.
       A mask, not a picture: one colour, no background, so the screen can
       tint it lit or spent. Drawn on a 16x16 pixel grid. -->
  <g fill="#ffffff">
    <rect x="16" y="12" width="8" height="4"/>
    <rect x="40" y="12" width="8" height="4"/>
    <rect x="12" y="16" width="16" height="4"/>
    <rect x="36" y="16" width="16" height="4"/>
    <rect x="8" y="20" width="48" height="4"/>
    <rect x="8" y="24" width="48" height="4"/>
    <rect x="8" y="28" width="48" height="4"/>
    <rect x="12" y="32" width="40" height="4"/>
    <rect x="16" y="36" width="32" height="4"/>
    <rect x="20" y="40" width="24" height="4"/>
    <rect x="24" y="44" width="16" height="4"/>
    <rect x="28" y="48" width="8" height="4"/>
  </g>
</svg>
