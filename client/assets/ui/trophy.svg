<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     shape-rendering="crispEdges">
  <!-- Trophy, one per win banked towards the run target.
       A mask, not a picture: one colour, no background, so the screen can
       tint it lit or spent. Drawn on a 16x16 pixel grid. The cup is kept deep
       and the stem short on purpose: taper it evenly and it reads as an
       hourglass instead. -->
  <g fill="#ffffff">
    <rect x="12" y="4" width="40" height="4"/>
    <rect x="12" y="8" width="40" height="4"/>
    <rect x="4" y="12" width="8" height="4"/>
    <rect x="16" y="12" width="32" height="4"/>
    <rect x="52" y="12" width="8" height="4"/>
    <rect x="4" y="16" width="8" height="4"/>
    <rect x="16" y="16" width="32" height="4"/>
    <rect x="52" y="16" width="8" height="4"/>
    <rect x="4" y="20" width="8" height="4"/>
    <rect x="16" y="20" width="32" height="4"/>
    <rect x="52" y="20" width="8" height="4"/>
    <rect x="8" y="24" width="8" height="4"/>
    <rect x="16" y="24" width="32" height="4"/>
    <rect x="48" y="24" width="8" height="4"/>
    <rect x="16" y="28" width="32" height="4"/>
    <rect x="20" y="32" width="24" height="4"/>
    <rect x="28" y="36" width="8" height="4"/>
    <rect x="28" y="40" width="8" height="4"/>
    <rect x="20" y="44" width="24" height="4"/>
    <rect x="12" y="48" width="40" height="4"/>
    <rect x="12" y="52" width="40" height="4"/>
  </g>
</svg>
